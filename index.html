<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ghislain_demo — site web de démonstration">
  <title>ghislain_demo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1020; color: #f5f7ff; }
    main { width: min(900px, 92%); padding: 64px 32px; text-align: center; }
    .badge { display: inline-block; padding: 8px 14px; border: 1px solid #334155; border-radius: 999px; color: #cbd5e1; font-size: .9rem; }
    h1 { margin: 24px 0 12px; font-size: clamp(2.5rem, 8vw, 5.5rem); line-height: .95; }
    p { max-width: 650px; margin: 0 auto 28px; color: #b6c2d9; font-size: 1.1rem; line-height: 1.7; }
    .message { margin: 24px auto 32px; font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 700; color: #fff; }
    a { display: inline-block; padding: 13px 20px; border-radius: 10px; background: #fff; color: #0b1020; text-decoration: none; font-weight: 700; }
    a:hover { transform: translateY(-2px); }
    footer { margin-top: 56px; color: #64748b; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <span class="badge">GitHub Pages ready</span>
    <h1>ghislain_demo</h1>
    <div class="message">Bonjour les scapiens et les scapiennes 👋</div>
    <p>Bienvenue sur la page web de démonstration. Ce site est statique, responsive et peut être publié directement avec GitHub Pages.</p>
    <a href="https://github.com/Ghislain5533/ghislain_demo">Voir le dépôt</a>
    <footer>© 2026 ghislain_demo</footer>
  </main>
</body>
</html>
