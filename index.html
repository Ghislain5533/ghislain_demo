
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acapella Brasil">
  <title>Acapella Brasil</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #f5f7ff;
    }
    main {
      width: min(900px, 92%);
      padding: 64px 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid #334155;
      border-radius: 999px;
      color: #cbd5e1;
    }
    h1 {
      margin: 24px 0 12px;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
    }
    p {
      max-width: 650px;
      margin: 0 auto 28px;
      color: #b6c2d9;
      line-height: 1.7;
    }
    .message {
      margin: 24px auto 32px;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 700;
    }
    main > a {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 10px;
      background: white;
      color: #0b1020;
      text-decoration: none;
      font-weight: 700;
    }
    footer {
      margin-top: 56px;
      padding-top: 25px;
      border-top: 1px solid #334155;
      color: #94a3b8;
      font-size: .9rem;
    }
    footer nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }
    footer a {
      color: #cbd5e1;
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Bienvenue</span>
    <h1>Acapella Brasil</h1>
    <div class="message">
      Bonjour les scapiens et les scapiennes 👋
    </div>
    <p>
      Bienvenue sur Acapella Brasil.
    </p>
    <a href="https://github.com/Ghislain5533/ghislain_demo">
      Voir le dépôt
    </a>

    <footer>
      <nav aria-label="Pied de page">
        <a href="contact.html">Contact</a>
        <a href="aide.html">Aide</a>
        <a href="info-site.html">Info site</a>
        <a href="accessibilite.html">Accessibilité : non conforme</a>
        <a href="index.html">Site de Acapella Brasil</a>
        <a href="donnees-personnelles.html">Cookies / Données personnelles</a>
        <a href="mentions-legales.html">Mentions légales</a>
      </nav>
      <p>© 2026 Acapella Brasil</p>
    </footer>
  </main>
</body>
</html>
