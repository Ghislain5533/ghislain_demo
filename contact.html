<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Acapella Brasil</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1020;
      color: #f5f7ff;
    }
    main {
      width: min(700px, 92%);
      margin: auto;
      padding: 55px 20px;
    }
    h1 { font-size: 2.5rem; }
    p, label { color: #cbd5e1; }
    form {
      display: grid;
      gap: 18px;
      margin-top: 30px;
    }
    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #172033;
      color: white;
      font: inherit;
    }
    textarea { min-height: 160px; resize: vertical; }
    button {
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: #0b1020;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #result { min-height: 24px; }
    footer {
      margin-top: 55px;
      padding: 25px 0;
      border-top: 1px solid #334155;
      color: #94a3b8;
      font-size: .9rem;
    }
    footer nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }
    footer a { color: #cbd5e1; }
  </style>
  <!-- Script Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<main>
  <h1>Contact</h1>
  <p>Une question ou une demande ? Écrivez-nous.</p>

  <form id="contact-form">
    <div>
      <label for="email">Adresse électronique</label>
      <input id="email" name="email" type="email"
        autocomplete="email" maxlength="254" required>
    </div>

    <div>
      <label for="subject">Sujet</label>
      <input id="subject" name="subject" type="text"
        maxlength="150" required>
    </div>

    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message"
        maxlength="5000" required></textarea>
    </div>

    <!-- Widget Turnstile (insérez votre clé de site Turnstile dans data-sitekey) -->
    <div class="cf-turnstile" data-sitekey="VOTRE_SITE_KEY_TURNSTILE"></div>

    <button id="submit-button" type="submit">
      Envoyer le message
    </button>

    <p>
      Les informations transmises servent uniquement à traiter votre demande.
      Consultez notre <a href="donnees-personnelles.html">politique de données personnelles</a>.
    </p>

    <p id="result" role="status" aria-live="polite"></p>
  </form>

  <footer>
    <nav aria-label="Pied de page">
      <a href="contact.html">Contact</a>
      <a href="aide.html">Aide</a>
      <a href="info-site.html">Info site</a>
      <a href="accessibilite.html">Accessibilité : non conforme</a>
      <a href="https://www.fmp.fr" target="_blank" rel="noopener noreferrer">Site de FMP</a>
      <a href="donnees-personnelles.html">Cookies / Données personnelles</a>
      <a href="mentions-legales.html">Mentions légales</a>
    </nav>
  </footer>
</main>
